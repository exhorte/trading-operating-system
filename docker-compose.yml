# Local infrastructure: the database, and only the database.
# TimescaleDB = PostgreSQL + the timescaledb extension, one container.
#
# The Python core (python/trading_os) and the cockpit (Next.js) run on the Windows host — MetaTrader5's Python package is
# Windows-only and talks to a terminal on this machine, so the core cannot live in a container (ADR 0016). `scripts/start.ps1`
# starts this container, applies the schema (`python -m trading_os db migrate`), then the core and the cockpit.
#
#   docker compose up -d timescaledb     create/start the database
#   docker compose down                  stop it (the data survives in the volume)
# Runbook: context/infrastructure/runbook.md
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: tradingos-timescaledb
    ports:
      # 5433 on the host by default (TRADINGOS_DB_PORT to change it): avoids colliding with any locally installed Postgres,
      # and lets the database start on another port while something else holds 5433 (the matching DATABASE_URL names it).
      # Loopback only — published on 0.0.0.0 until 2026-09-25, which let any
      # device on the LAN read and write the trading database with the dev
      # password below.
      - "127.0.0.1:${TRADINGOS_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: tradingos
      POSTGRES_USER: tradingos
      # Local dev only — never a production credential.
      POSTGRES_PASSWORD: tradingos_dev
    volumes:
      - tradingos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingos -d tradingos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # The data volume was created under the compose project that first ran this service. Declaring it external by that exact
  # name is what keeps a recreate from this directory on the real data — otherwise compose mounts `04_code_tradingos-pgdata`
  # (it exists, stale) and TradingOS silently starts on the wrong database (checked live 2026-09-25). Never create it empty.
  tradingos-pgdata:
    name: trading_operating_system_algorithmique_tradingos-pgdata
    external: true
